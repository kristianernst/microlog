name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest ruff pyright
      - name: Verify installed artifact outside checkout
        working-directory: /tmp
        run: |
          python -I - <<'PY'
          import logging
          import os
          from pathlib import Path

          import microlog

          module_path = Path(microlog.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if module_path.is_relative_to(workspace):
              raise SystemExit(f"microlog imported from checkout: {module_path}")

          cfg = microlog.LogConfig(async_mode=False)
          microlog.configure_logging(cfg)
          microlog.get_logger("smoke", cfg).info("installed-artifact")
          logging.shutdown()
          print(module_path)
          PY
      - name: Run Ruff
        run: ruff check
      - name: Run Pyright
        run: pyright
      - name: Run pytest
        run: pytest
      - name: Benchmark guard
        run: |
          python -m benchmarks.benchmark \
            --count 20000 \
            --min-sync-rps 2500 \
            --min-async-rps 2500 \
            --max-drop-rate 0.05
  otlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies with OTLP extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[opentelemetry]" pytest
      - name: Run pytest with OTLP extras
        run: pytest
