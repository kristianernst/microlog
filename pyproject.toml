[project]
name = "microlog"
version = "0.1.0"
description = "microlog is a small lightweight logging library for Python particularly designed for microservices and serverless environments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-exporter-otlp>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
]
performance = [
    "orjson>=3.10.0",
]


[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
exclude = [".venv", ".pre-commit", ".git", "examples", "tests"]
stubPath = "microlog/types"
reportMissingModuleSource = "none"
reportMissingImports = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.406",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E401"]

[tool.ruff.format]
docstring-code-format = true
